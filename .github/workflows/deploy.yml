name: deploy my website
on: 
   push:
        branches:
                - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
     deploy:
            runs-on: windows
            steps:
               - name: Get my website files
                 uses: actions/checkout@6
               - name: Prepare website files
                 uses: actions/configure-pages@v5
               - name: upload website files 
                 uses: actions/upload-pages-artifact@v4
                 with:
                      path:  .
                        -  name:  publish my website
                           uses: actions/deploy-pages@v4   